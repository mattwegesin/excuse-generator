<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Excuse Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-primary">Architecture Review Board</h1>
                <p class="lead text-muted">Official Incident Response & Deflection System</p>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <form method="post" action="/">
                        <div class="mb-3">
                            <label for="issue" class="form-label fw-bold">Describe the "Issue"</label>
                            <input type="text" class="form-control form-control-lg" id="issue" name="issue" 
                                   placeholder="e.g., The lobby Wi-Fi is down..." 
                                   value="{{ issue }}" required autofocus>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" id="generateBtn" class="btn btn-primary btn-lg">Generate Official RCA</button>
                        </div>
                    </form>
                </div>
            </div>

            {% if excuse_html %}
            <div class="card shadow-sm border-danger mb-4">
                <div class="card-header bg-danger text-white fw-bold">
                    Official Root Cause Analysis
                </div>
                <div class="card-body p-4 bg-white excuse-content">
                    {{ excuse_html | safe }}
                </div>
            </div>
            {% endif %}

        </div>
    </div>
</div>

<footer class="text-center text-muted py-4 mt-5">
    <div class="container">
        <p class="mb-0 fw-bold">Remember, it's never the network.™</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Loading State Script -->
<script>
    document.querySelector('form').addEventListener('submit', function() {
        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Consulting Stakeholders...';
    });
</script>
</body>
</html>
