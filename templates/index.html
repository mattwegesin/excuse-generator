<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Excuse Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-primary">Architecture Review Board</h1>
                <p class="lead text-muted">Official Incident Response & Deflection System</p>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <form id="excuseForm">
                        <div class="mb-3">
                            <label for="issue" class="form-label fw-bold">Describe the "Issue"</label>
                            <input type="text" class="form-control form-control-lg" id="issue" name="issue" 
                                   placeholder="e.g., The lobby Wi-Fi is down..." 
                                   required autofocus>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" id="generateBtn" class="btn btn-primary btn-lg">Generate Official RCA</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="resultContainer"></div>

        </div>
    </div>
</div>

<footer class="text-center text-muted py-4 mt-5">
    <div class="container">
        <p class="mb-0 fw-bold">Remember, it's never the network.™</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Loading State & AJAX Script -->
<script>
    document.getElementById('excuseForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Prevent page reload
        
        const btn = document.getElementById('generateBtn');
        const issueInput = document.getElementById('issue');
        const container = document.getElementById('resultContainer');
        const originalBtnText = btn.innerHTML;
        
        const snarkyLines = [
            "Consulting the Architecture Review Board...",
            "Blaming the intern...",
            "Checking for BGP route flaps...",
            "Drafting a synergistic paradigm shift...",
            "Measuring Wi-Fi attenuation...",
            "Updating the Jira ticket nobody reads...",
            "Inventing new RF acronyms...",
            "Optimizing the ROI of this excuse..."
        ];
        
        btn.disabled = true;
        container.innerHTML = ""; // Clear previous excuse
        
        let i = 0;
        const updateText = () => {
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>${snarkyLines[i % snarkyLines.length]}`;
            i++;
        };
        
        updateText();
        const intervalId = setInterval(updateText, 2000);
        
        try {
            const formData = new FormData();
            formData.append('issue', issueInput.value);
            
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.excuse_html) {
                container.innerHTML = `
                <div class="card shadow-sm border-danger mb-4">
                    <div class="card-header bg-danger text-white fw-bold">
                        Official Root Cause Analysis
                    </div>
                    <div class="card-body p-4 bg-white excuse-content">
                        ${data.excuse_html}
                    </div>
                </div>`;
            } else if (data.error) {
                container.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        } catch (error) {
            container.innerHTML = `<div class="alert alert-danger">Error contacting the Architecture Review Board.</div>`;
        } finally {
            clearInterval(intervalId);
            btn.disabled = false;
            btn.innerHTML = originalBtnText;
        }
    });
</script>
</body>
</html>
